openapi: 3.1.2
info:
  title: VK Platform IAM API
  version: v1
  description: >-
    Purpose-bound passwordless authentication and OAuth 2.0 authorization capabilities for VK Platform.
    This phase is OAuth-only: it does not publish OpenID Connect discovery, issue ID tokens, or implement
    nonce handling. Email verification proves short-lived control of a mailbox and does not grant resource
    access by itself.
servers:
  - url: /
    description: Current API origin
tags:
  - name: Platform
    description: IAM service-level operations.
  - name: Email Verification
    description: >-
      Purpose-bound email verification operations. These routes are available only when the IAM Service
      email provider is configured and enabled.
  - name: Authentication
    description: Passwordless sign-in challenges and one-time identity grants.
paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
        - Platform
      summary: Check IAM Service health
      responses:
        "200":
          description: The IAM Service process is healthy.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: iam
  /api/v1/email-verifications:
    post:
      operationId: startEmailVerification
      tags:
        - Email Verification
      summary: Start an email verification challenge
      description: |
        Creates a short-lived challenge and sends a six-digit code. The request
        body is limited to 4 KiB and must contain exactly one JSON object with no
        unknown fields. This operation is documented but disabled for execution
        in the hosted Swagger UI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartEmailVerificationRequest"
            example:
              email: visitor@example.com
              purpose: restricted_resource_access
      responses:
        "202":
          description: The challenge was created and its code was accepted for delivery.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallengeResponse"
        "400":
          $ref: "#/components/responses/StartEmailVerificationBadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/EmailVerificationRateLimited"
        "500":
          $ref: "#/components/responses/EmailVerificationInternalError"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /api/v1/email-verifications/{id}/verify:
    post:
      operationId: verifyEmailChallenge
      tags:
        - Email Verification
      summary: Verify an email challenge
      description: |
        Verifies an active challenge once. The request body is limited to 1 KiB
        and must contain exactly one JSON object with no unknown fields. This
        operation is documented but disabled for execution in the hosted Swagger UI.
      parameters:
        - name: id
          in: path
          description: Verification challenge UUID returned by the start operation.
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          example: 123e4567-e89b-42d3-a456-426614174000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailChallengeRequest"
            example:
              code: "123456"
      responses:
        "200":
          description: The challenge was verified successfully.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiedEmailResponse"
        "400":
          $ref: "#/components/responses/VerifyEmailChallengeBadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/InvalidOrExpiredCode"
        "500":
          $ref: "#/components/responses/EmailVerificationInternalError"
  /api/v1/authentication/challenges:
    post:
      operationId: startPasswordlessSignIn
      tags:
        - Authentication
      summary: Start a passwordless sign-in challenge
      description: |
        Sends a six-digit sign-in code without retaining the raw email address.
        The request body is limited to 4 KiB and rejects unknown fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAuthenticationChallengeRequest"
            example:
              email: visitor@example.com
      responses:
        "202":
          description: The sign-in challenge was accepted for delivery.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationChallengeResponse"
        "400":
          $ref: "#/components/responses/StartEmailVerificationBadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/EmailVerificationRateLimited"
        "500":
          $ref: "#/components/responses/EmailVerificationInternalError"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /api/v1/authentication/challenges/{id}/verify:
    post:
      operationId: verifyPasswordlessSignIn
      tags:
        - Authentication
      summary: Verify a passwordless sign-in challenge
      description: |
        Verifies the sign-in code and returns a five-minute, audience-bound,
        one-time grant. The grant is returned once and only its SHA-256 digest
        is retained.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailChallengeRequest"
            example:
              code: "123456"
      responses:
        "200":
          description: A one-time sign-in grant was issued.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationGrantResponse"
        "400":
          $ref: "#/components/responses/VerifyEmailChallengeBadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/AuthenticationFailed"
        "500":
          $ref: "#/components/responses/EmailVerificationInternalError"
  /api/v1/authentication/grants/exchange:
    post:
      operationId: establishPasswordlessSession
      tags:
        - Authentication
      summary: Exchange a one-time sign-in grant for an authorization-server session
      description: >-
        Authenticated BFF-only operation. It consumes the grant once, creates a durable IAM session,
        and establishes the Secure, HttpOnly, SameSite=Lax authorization-server cookie that the BFF
        forwards to the browser. Tokens are issued only by the OAuth token endpoint.
      security:
        - bffClientAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeAuthenticationGrantRequest"
      responses:
        "200":
          description: The browser can resume its Authorization Code with PKCE request.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/SessionBadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /api/v1/authentication/session:
    get:
      operationId: getCurrentAuthenticationSession
      tags:
        - Authentication
      summary: Read the current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current session details.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
  /api/v1/authentication/sessions:
    get:
      operationId: listAuthenticationSessions
      tags:
        - Authentication
      summary: List active sessions for the current account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active sessions ordered newest first.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsEnvelope"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
    delete:
      operationId: revokeAllAuthenticationSessions
      tags:
        - Authentication
      summary: Revoke all sessions for the current account
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All sessions and their refresh families were revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
  /api/v1/authentication/sessions/{sessionId}:
    delete:
      operationId: revokeAuthenticationSession
      tags:
        - Authentication
      summary: Revoke one session owned by the current account
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session and its refresh family were revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "404":
          $ref: "#/components/responses/SessionNotFound"
  /api/v1/authentication/logout:
    post:
      operationId: logoutAuthenticationSession
      tags:
        - Authentication
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: >-
            The durable session and refresh family were revoked, the server-side authorization session
            was invalidated when its cookie was present, and the IAM browser cookie was expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
  /oauth2/token:
    post:
      operationId: exchangeOAuthToken
      tags:
        - Authentication
      summary: Exchange an OAuth authorization code, refresh token, or client credential
      description: The form body is limited to 8 KiB, including chunked requests.
      security:
        - bffClientAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OAuth token response.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          description: OAuth invalid request or grant response.
        "401":
          description: OAuth client authentication failed.
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    bffClientAuth:
      type: http
      scheme: basic
  headers:
    RequestID:
      description: Server-generated identifier for correlating a request with API logs.
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
      example: 0a1b2c3d4e5f67890123456789abcdef
    NoStore:
      description: Prevents storage of security-sensitive responses.
      required: true
      schema:
        type: string
        const: no-store
      example: no-store
    RetryAfter:
      description: Seconds to wait before requesting another verification challenge.
      required: true
      schema:
        type: integer
        minimum: 1
      example: 60
  responses:
    PayloadTooLarge:
      description: The endpoint-specific request-body limit was exceeded.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: REQUEST_BODY_TOO_LARGE
            message: The request body is too large.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: false
    SessionBadRequest:
      description: The grant-exchange request is invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
    SessionNotFound:
      description: The session was not found for the current account.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
    StartEmailVerificationBadRequest:
      description: The JSON body, email, or verification purpose is invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          examples:
            invalidBody:
              summary: Invalid request body
              value:
                code: INVALID_REQUEST_BODY
                message: The request body is invalid.
                request_id: 0a1b2c3d4e5f67890123456789abcdef
                retryable: false
            invalidEmail:
              summary: Invalid email
              value:
                code: INVALID_EMAIL
                message: Enter a valid email address.
                request_id: 0a1b2c3d4e5f67890123456789abcdef
                retryable: false
                fields:
                  email:
                    - Enter a valid email address.
            invalidPurpose:
              summary: Unsupported verification purpose
              value:
                code: INVALID_VERIFICATION_PURPOSE
                message: The requested verification purpose is not supported.
                request_id: 0a1b2c3d4e5f67890123456789abcdef
                retryable: false
                fields:
                  purpose:
                    - Choose a supported verification purpose.
    EmailVerificationRateLimited:
      description: Another challenge cannot be requested yet.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: EMAIL_VERIFICATION_RATE_LIMITED
            message: Please wait before requesting another verification code.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: true
    EmailDeliveryUnavailable:
      description: The verification email could not be delivered.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: EMAIL_DELIVERY_UNAVAILABLE
            message: We could not send the verification email. Try again later.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: true
    VerifyEmailChallengeBadRequest:
      description: The challenge ID, code, or JSON body is invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          examples:
            invalidBody:
              summary: Invalid request body
              value:
                code: INVALID_REQUEST_BODY
                message: The request body is invalid.
                request_id: 0a1b2c3d4e5f67890123456789abcdef
                retryable: false
            invalidID:
              summary: Invalid challenge identifier
              value:
                code: INVALID_VERIFICATION_ID
                message: The verification request is invalid. Request a new code and try again.
                request_id: 0a1b2c3d4e5f67890123456789abcdef
                retryable: false
                fields:
                  id:
                    - Use the verification ID returned when the code was requested.
            invalidCode:
              summary: Invalid verification code format
              value:
                code: INVALID_CODE_FORMAT
                message: Enter the six-digit verification code.
                request_id: 0a1b2c3d4e5f67890123456789abcdef
                retryable: false
                fields:
                  code:
                    - Enter exactly six digits.
    InvalidOrExpiredCode:
      description: The challenge is missing, incorrect, expired, consumed, or attempt-exhausted.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: INVALID_OR_EXPIRED_CODE
            message: The verification code is invalid or expired. Request a new code and try again.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: false
    AuthenticationFailed:
      description: The challenge, grant, or account state cannot complete authentication.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: AUTHENTICATION_FAILED
            message: Authentication could not be completed. Start again and request a new code.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: false
    EmailVerificationInternalError:
      description: An unexpected internal failure occurred.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: INTERNAL_ERROR
            message: Something went wrong. Try again later or contact support with the request ID.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: true
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: iam
    VerificationPurpose:
      type: string
      enum:
        - restricted_resource_access
    StartEmailVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - purpose
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        purpose:
          $ref: "#/components/schemas/VerificationPurpose"
    StartAuthenticationChallengeRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    VerifyEmailChallengeRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
    EmailChallenge:
      type: object
      additionalProperties: false
      required:
        - id
        - masked_email
        - expires_at
        - resend_after
      properties:
        id:
          type: string
          format: uuid
        masked_email:
          type: string
        expires_at:
          type: string
          format: date-time
        resend_after:
          type: string
          format: date-time
    EmailChallengeResponse:
      type: object
      additionalProperties: false
      required:
        - verification
      properties:
        verification:
          $ref: "#/components/schemas/EmailChallenge"
    VerifiedEmail:
      type: object
      additionalProperties: false
      required:
        - id
        - purpose
        - verified_at
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: "#/components/schemas/VerificationPurpose"
        verified_at:
          type: string
          format: date-time
    VerifiedEmailResponse:
      type: object
      additionalProperties: false
      required:
        - verification
      properties:
        verification:
          $ref: "#/components/schemas/VerifiedEmail"
    AuthenticationChallengeResponse:
      type: object
      additionalProperties: false
      required:
        - challenge
      properties:
        challenge:
          $ref: "#/components/schemas/EmailChallenge"
    AuthenticationGrant:
      type: object
      additionalProperties: false
      required:
        - account_id
        - value
        - audience
        - expires_at
      properties:
        account_id:
          type: string
          format: uuid
        value:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        audience:
          type: string
          minLength: 1
          maxLength: 128
        expires_at:
          type: string
          format: date-time
    AuthenticationGrantResponse:
      type: object
      additionalProperties: false
      required:
        - grant
      properties:
        grant:
          $ref: "#/components/schemas/AuthenticationGrant"
    ExchangeAuthenticationGrantRequest:
      type: object
      additionalProperties: false
      required:
        - grant
        - audience
      properties:
        grant:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        audience:
          type: string
          minLength: 1
          maxLength: 128
    AuthenticationSession:
      type: object
      additionalProperties: false
      required:
        - id
        - client_id
        - status
        - created_at
        - last_refreshed_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
        status:
          type: string
          enum: [active, revoked, compromised]
        created_at:
          type: string
          format: date-time
        last_refreshed_at:
          type: string
          format: date-time
          description: Time of the most recent successful refresh-token rotation, not API activity.
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        compromised_at:
          type: [string, "null"]
          format: date-time
        revoke_reason:
          type: [string, "null"]
    SessionEnvelope:
      type: object
      additionalProperties: false
      required:
        - session
      properties:
        session:
          $ref: "#/components/schemas/AuthenticationSession"
    SessionsEnvelope:
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/AuthenticationSession"
    PublicError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        retryable:
          type: boolean
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
