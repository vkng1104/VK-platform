openapi: 3.1.2
info:
  title: VK Platform IAM API
  version: v1
  description: >-
    Purpose-bound passwordless authentication and OAuth 2.0 authorization capabilities for VK Platform.
    Email verification proves short-lived control of a mailbox and does not grant resource access by itself.
servers:
  - url: /
    description: Current API origin
tags:
  - name: Platform
    description: IAM service-level operations.
  - name: Email Verification
    description: >-
      Purpose-bound email verification operations. These routes are available only when the IAM Service
      email provider is configured and enabled.
  - name: Authentication
    description: Passwordless sign-in challenges and one-time identity grants.
  - name: OAuth
    description: OAuth 2.0 signing and public verification metadata.
paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
        - Platform
      summary: Check IAM Service health
      responses:
        "200":
          description: The IAM Service process is healthy.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              description: Public cache policy for the key set.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: iam
  /oauth2/jwks:
    get:
      operationId: getOAuthJsonWebKeySet
      tags:
        - OAuth
      summary: Get OAuth signing public keys
      description: Returns public RSA keys used to verify IAM-issued access tokens. Private key material is never exposed.
      responses:
        "200":
          description: The currently published JSON Web Key Set.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonWebKeySet"
  /oauth2/authorize:
    get:
      operationId: authorizeOAuthClient
      tags:
        - OAuth
      summary: Start an OAuth authorization-code flow
      description: Requires an authenticated browser session and PKCE using the S256 challenge method.
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            const: code
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: true
          schema:
            type: string
            const: api.access
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 128
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
      responses:
        "302":
          description: Redirects to the registered BFF callback with an authorization code and the original state.
        "400":
          description: The OAuth authorization request is invalid.
  /oauth2/token:
    post:
      operationId: exchangeOAuthToken
      tags:
        - OAuth
      summary: Exchange an authorization code or refresh token
      description: >-
        Supports authorization_code with PKCE and one-time refresh_token rotation. Reusing a consumed
        refresh token invalidates its authorization and compromises the owning durable session.
      security:
        - bffClientAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                code:
                  type: string
                  minLength: 1
                redirect_uri:
                  type: string
                  format: uri
                code_verifier:
                  type: string
                  minLength: 43
                  maxLength: 128
                refresh_token:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: A signed bearer access token and one-time refresh token were issued.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthAccessTokenResponse"
        "400":
          description: The authorization code, refresh token, redirect URI, or PKCE verifier is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: OAuth client authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /api/v1/email-verifications:
    post:
      operationId: startEmailVerification
      tags:
        - Email Verification
      summary: Start an email verification challenge
      description: |
        Creates a short-lived challenge and sends a six-digit code. The request
        body is limited to 4 KiB and must contain exactly one JSON object with no
        unknown fields. This operation is documented but disabled for execution
        in the hosted Swagger UI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartEmailVerificationRequest"
            example:
              email: visitor@example.com
              purpose: restricted_resource_access
      responses:
        "202":
          description: The challenge was created and its code was accepted for delivery.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallengeResponse"
        "400":
          $ref: "#/components/responses/StartEmailVerificationBadRequest"
        "429":
          $ref: "#/components/responses/EmailVerificationRateLimited"
        "500":
          $ref: "#/components/responses/EmailVerificationInternalError"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /api/v1/email-verifications/{id}/verify:
    post:
      operationId: verifyEmailChallenge
      tags:
        - Email Verification
      summary: Verify an email challenge
      description: |
        Verifies an active challenge once. The request body is limited to 1 KiB
        and must contain exactly one JSON object with no unknown fields. This
        operation is documented but disabled for execution in the hosted Swagger UI.
      parameters:
        - name: id
          in: path
          description: Verification challenge UUID returned by the start operation.
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          example: 123e4567-e89b-42d3-a456-426614174000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailChallengeRequest"
            example:
              code: "123456"
      responses:
        "200":
          description: The challenge was verified successfully.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiedEmailResponse"
        "400":
          $ref: "#/components/responses/VerifyEmailChallengeBadRequest"
        "422":
          $ref: "#/components/responses/InvalidOrExpiredCode"
        "500":
          $ref: "#/components/responses/EmailVerificationInternalError"
  /api/v1/authentication/challenges:
    post:
      operationId: startPasswordlessSignIn
      tags:
        - Authentication
      summary: Start a passwordless sign-in challenge
      description: |
        Sends a six-digit sign-in code without retaining the raw email address.
        The request body is limited to 4 KiB and rejects unknown fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAuthenticationChallengeRequest"
            example:
              email: visitor@example.com
      responses:
        "202":
          description: The sign-in challenge was accepted for delivery.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationChallengeResponse"
        "400":
          $ref: "#/components/responses/StartEmailVerificationBadRequest"
        "429":
          $ref: "#/components/responses/EmailVerificationRateLimited"
        "500":
          $ref: "#/components/responses/EmailVerificationInternalError"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /api/v1/authentication/challenges/{id}/verify:
    post:
      operationId: verifyPasswordlessSignIn
      tags:
        - Authentication
      summary: Verify a passwordless sign-in challenge
      description: |
        Verifies the sign-in code and returns a five-minute, audience-bound,
        one-time grant. The grant is returned once and only its SHA-256 digest
        is retained.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailChallengeRequest"
            example:
              code: "123456"
      responses:
        "200":
          description: A one-time sign-in grant was issued.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationGrantResponse"
        "400":
          $ref: "#/components/responses/VerifyEmailChallengeBadRequest"
        "422":
          $ref: "#/components/responses/AuthenticationFailed"
        "500":
          $ref: "#/components/responses/EmailVerificationInternalError"
  /api/v1/authentication/grants/exchange:
    post:
      operationId: exchangeAuthenticationGrant
      tags:
        - Authentication
      summary: Exchange a one-time sign-in grant for a browser session
      description: >-
        Authenticated BFF-only operation. It consumes the grant once, creates a durable IAM session,
        and establishes the Secure, HttpOnly, SameSite=Lax browser-session cookie. The JSON request
        body is limited to 1 KiB and must contain exactly one object with no unknown fields.
      security:
        - bffClientAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeAuthenticationGrantRequest"
      responses:
        "200":
          description: The one-time grant was exchanged for an active browser session.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationSessionResponse"
        "400":
          $ref: "#/components/responses/ExchangeAuthenticationGrantBadRequest"
        "401":
          $ref: "#/components/responses/BffAuthenticationRequired"
        "403":
          $ref: "#/components/responses/UntrustedBffRequest"
        "422":
          $ref: "#/components/responses/AuthenticationFailed"
        "500":
          $ref: "#/components/responses/EmailVerificationInternalError"
  /api/v1/authentication/session:
    get:
      operationId: getCurrentAuthenticationSession
      tags:
        - Authentication
      summary: Read the current durable authentication session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current usable session details.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationSessionResponse"
        "401":
          $ref: "#/components/responses/SessionAuthenticationRequired"
  /api/v1/authentication/sessions:
    get:
      operationId: listAuthenticationSessions
      tags:
        - Authentication
      summary: List active sessions for the current account
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Active unexpired sessions ordered by creation time and ID descending.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationSessionsResponse"
        "400":
          $ref: "#/components/responses/SessionBadRequest"
        "401":
          $ref: "#/components/responses/SessionAuthenticationRequired"
    delete:
      operationId: revokeAllAuthenticationSessions
      tags:
        - Authentication
      summary: Revoke all sessions for the current account
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Every active session and authorization was revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/SessionAuthenticationRequired"
  /api/v1/authentication/sessions/{session_id}:
    delete:
      operationId: revokeAuthenticationSession
      tags:
        - Authentication
      summary: Revoke one session owned by the current account
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The owned session and authorization were revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/SessionAuthenticationRequired"
        "404":
          $ref: "#/components/responses/SessionNotFound"
  /api/v1/authentication/logout:
    post:
      operationId: logoutAuthenticationSession
      tags:
        - Authentication
      summary: Revoke the current session and clear browser state
      security:
        - bearerAuth: []
      responses:
        "204":
          description: >-
            The current durable session and authorization were revoked, any framework session was
            invalidated, and the configured IAM browser cookie was expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/SessionAuthenticationRequired"
components:
  securitySchemes:
    bffClientAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestID:
      description: Server-generated identifier for correlating a request with API logs.
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
      example: 0a1b2c3d4e5f67890123456789abcdef
    NoStore:
      description: Prevents storage of security-sensitive responses.
      required: true
      schema:
        type: string
        const: no-store
      example: no-store
    RetryAfter:
      description: Seconds to wait before requesting another verification challenge.
      required: true
      schema:
        type: integer
        minimum: 1
      example: 60
  responses:
    SessionBadRequest:
      description: Pagination or session request input is invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
    SessionAuthenticationRequired:
      description: The bearer token or current durable session is unavailable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
    SessionNotFound:
      description: The target session was not found for the authenticated account.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
    ExchangeAuthenticationGrantBadRequest:
      description: The JSON body or authentication audience is invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
    BffAuthenticationRequired:
      description: Valid BFF client credentials were not supplied.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
    UntrustedBffRequest:
      description: The request did not originate from the configured BFF context.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
    StartEmailVerificationBadRequest:
      description: The JSON body, email, or verification purpose is invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          examples:
            invalidBody:
              summary: Invalid request body
              value:
                code: INVALID_REQUEST_BODY
                message: The request body is invalid.
                request_id: 0a1b2c3d4e5f67890123456789abcdef
                retryable: false
            invalidEmail:
              summary: Invalid email
              value:
                code: INVALID_EMAIL
                message: Enter a valid email address.
                request_id: 0a1b2c3d4e5f67890123456789abcdef
                retryable: false
                fields:
                  email:
                    - Enter a valid email address.
            invalidPurpose:
              summary: Unsupported verification purpose
              value:
                code: INVALID_VERIFICATION_PURPOSE
                message: The requested verification purpose is not supported.
                request_id: 0a1b2c3d4e5f67890123456789abcdef
                retryable: false
                fields:
                  purpose:
                    - Choose a supported verification purpose.
    EmailVerificationRateLimited:
      description: Another challenge cannot be requested yet.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: EMAIL_VERIFICATION_RATE_LIMITED
            message: Please wait before requesting another verification code.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: true
    EmailDeliveryUnavailable:
      description: The verification email could not be delivered.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: EMAIL_DELIVERY_UNAVAILABLE
            message: We could not send the verification email. Try again later.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: true
    VerifyEmailChallengeBadRequest:
      description: The challenge ID, code, or JSON body is invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          examples:
            invalidBody:
              summary: Invalid request body
              value:
                code: INVALID_REQUEST_BODY
                message: The request body is invalid.
                request_id: 0a1b2c3d4e5f67890123456789abcdef
                retryable: false
            invalidID:
              summary: Invalid challenge identifier
              value:
                code: INVALID_VERIFICATION_ID
                message: The verification request is invalid. Request a new code and try again.
                request_id: 0a1b2c3d4e5f67890123456789abcdef
                retryable: false
                fields:
                  id:
                    - Use the verification ID returned when the code was requested.
            invalidCode:
              summary: Invalid verification code format
              value:
                code: INVALID_CODE_FORMAT
                message: Enter the six-digit verification code.
                request_id: 0a1b2c3d4e5f67890123456789abcdef
                retryable: false
                fields:
                  code:
                    - Enter exactly six digits.
    InvalidOrExpiredCode:
      description: The challenge is missing, incorrect, expired, consumed, or attempt-exhausted.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: INVALID_OR_EXPIRED_CODE
            message: The verification code is invalid or expired. Request a new code and try again.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: false
    AuthenticationFailed:
      description: The challenge, grant, or account state cannot complete authentication.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: AUTHENTICATION_FAILED
            message: Authentication could not be completed. Start again and request a new code.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: false
    EmailVerificationInternalError:
      description: An unexpected internal failure occurred.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: INTERNAL_ERROR
            message: Something went wrong. Try again later or contact support with the request ID.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: true
  schemas:
    OAuthAccessTokenResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - scope
      properties:
        access_token:
          type: string
          minLength: 1
        refresh_token:
          type: string
          minLength: 1
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
        scope:
          type: string
          const: api.access
    OAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        error_description:
          type: string
        error_uri:
          type: string
          format: uri
    JsonWebKeySet:
      type: object
      additionalProperties: false
      required:
        - keys
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/JsonWebKey"
    JsonWebKey:
      type: object
      additionalProperties: false
      required:
        - kty
        - use
        - kid
        - alg
        - n
        - e
      properties:
        kty:
          type: string
          const: RSA
        use:
          type: string
          const: sig
        kid:
          type: string
          minLength: 1
          maxLength: 128
        alg:
          type: string
          const: RS256
        n:
          type: string
          minLength: 1
        e:
          type: string
          minLength: 1
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: iam
    VerificationPurpose:
      type: string
      enum:
        - restricted_resource_access
    StartEmailVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - purpose
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        purpose:
          $ref: "#/components/schemas/VerificationPurpose"
    StartAuthenticationChallengeRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    VerifyEmailChallengeRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
    EmailChallenge:
      type: object
      additionalProperties: false
      required:
        - id
        - masked_email
        - expires_at
