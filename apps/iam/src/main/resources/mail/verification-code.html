<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VK Platform email verification</title>
</head>
<body style="margin:0;background:#f6f7f9;color:#1f2937;font-family:Arial,sans-serif">
  <div style="max-width:560px;margin:0 auto;padding:32px 24px">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:32px">
      <p>Your VK Platform verification code is:</p>
      <p style="margin:24px 0;font-size:32px;font-weight:700;letter-spacing:8px">{{CODE}}</p>
      <p>This code expires at {{EXPIRES_AT}}.</p>
      <p style="color:#6b7280;font-size:14px;line-height:1.5">
        If you did not request this code, you can ignore this email.
      </p>
    </div>
  </div>
</body>
</html>
