spring:
  application:
    name: iam
  datasource:
    url: ${IAM_DATABASE_URL:jdbc:postgresql://localhost:5436/vk_platform_iam}
    username: ${IAM_DATABASE_USERNAME:vk_platform_iam}
    password: ${IAM_DATABASE_PASSWORD:vk_platform_iam}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    default-property-inclusion: non_null

logging:
  pattern:
    level: "%5p [request_id=%X{request_id:-}]"

server:
  port: ${IAM_PORT:8081}
  shutdown: graceful
  max-http-request-header-size: 1MB
  servlet:
    session:
      timeout: ${IAM_BROWSER_SESSION_TIMEOUT:P30D}
      cookie:
        name: ${IAM_SESSION_COOKIE_NAME:VK_IAM_SESSION}
        http-only: true
        secure: ${IAM_SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

iam:
  authentication:
    audience: ${IAM_AUTHENTICATION_AUDIENCE:vk-platform-web}
    grant-ttl: ${IAM_AUTHENTICATION_GRANT_TTL:PT5M}
  session:
    enabled: ${IAM_SESSION_ENABLED:false}
    issuer: ${IAM_TOKEN_ISSUER:http://localhost:8081}
    audience: ${IAM_TOKEN_AUDIENCE:vk-platform-api}
    authentication-audience: ${IAM_AUTHENTICATION_AUDIENCE:vk-platform-web}
    bff-client-id: ${IAM_BFF_CLIENT_ID:vk-platform-bff}
    access-token-ttl: ${IAM_ACCESS_TOKEN_TTL:PT5M}
    jwks-cache-ttl: ${IAM_OAUTH_JWKS_CACHE_TTL:PT5M}
    refresh-token-ttl: ${IAM_REFRESH_TOKEN_TTL:P30D}
    absolute-session-ttl: ${IAM_ABSOLUTE_SESSION_TTL:P30D}
    login-uri: ${IAM_LOGIN_URI:http://localhost:3000/sign-in}
    bff-origin: ${IAM_BFF_ORIGIN:http://localhost:3000}
    signing-key-id: ${IAM_SIGNING_KEY_ID:}
    signing-private-key-pkcs8-base64: ${IAM_SIGNING_PRIVATE_KEY_PKCS8_BASE64:}
    signing-public-key-x509-base64: ${IAM_SIGNING_PUBLIC_KEY_X509_BASE64:}
    signing-key-encryption-key-base64: ${IAM_SIGNING_KEY_ENCRYPTION_KEY_BASE64:}
    signing-key-protection-version: ${IAM_SIGNING_KEY_PROTECTION_VERSION:v1}
    signing-key-protection-keys: ${IAM_SIGNING_KEY_PROTECTION_KEYS:}
    bff-client-secret: ${IAM_BFF_CLIENT_SECRET:}
    bff-redirect-uri: ${IAM_BFF_REDIRECT_URI:http://localhost:3000/api/auth/callback}
    service-client-id: ${IAM_SERVICE_CLIENT_ID:vk-platform-api}
    service-client-secret: ${IAM_SERVICE_CLIENT_SECRET:}
    service-audience: ${IAM_SERVICE_TOKEN_AUDIENCE:vk-platform-iam}
    browser-cookie-name: ${IAM_SESSION_COOKIE_NAME:VK_IAM_SESSION}
    browser-cookie-secure: ${IAM_SESSION_COOKIE_SECURE:true}
    cleanup-enabled: ${IAM_SESSION_CLEANUP_ENABLED:true}
    session-retention: ${IAM_SESSION_RETENTION:P30D}
    authorization-retention: ${IAM_AUTHORIZATION_RETENTION:P30D}
    audit-retention: ${IAM_SECURITY_AUDIT_RETENTION:P365D}
    cleanup-batch-size: ${IAM_SESSION_CLEANUP_BATCH_SIZE:100}
    operator-operation: ${IAM_SESSION_OPERATOR_OPERATION:}
    operator-actor: ${IAM_SESSION_OPERATOR_ACTOR:}
    operator-operation-id: ${IAM_SESSION_OPERATOR_OPERATION_ID:}
    operator-key-id: ${IAM_SESSION_OPERATOR_KEY_ID:}
    operator-client-id: ${IAM_SESSION_OPERATOR_CLIENT_ID:}
    operator-client-secret: ${IAM_SESSION_OPERATOR_CLIENT_SECRET:}
    operator-client-secret-expires-at: ${IAM_SESSION_OPERATOR_CLIENT_SECRET_EXPIRES_AT:}
    operator-batch-size: ${IAM_SESSION_OPERATOR_BATCH_SIZE:100}
  email:
    provider: ${EMAIL_PROVIDER:disabled}
    from-address: ${EMAIL_FROM_ADDRESS:}
    gmail-client-id: ${GMAIL_CLIENT_ID:}
    gmail-client-secret: ${GMAIL_CLIENT_SECRET:}
    gmail-refresh-token: ${GMAIL_REFRESH_TOKEN:}
    otp-pepper: ${EMAIL_OTP_PEPPER:}
    rate-limit-secret: ${EMAIL_RATE_LIMIT_SECRET:}
    cleanup-enabled: ${EMAIL_VERIFICATION_CLEANUP_ENABLED:true}
    cleanup-retention: ${EMAIL_VERIFICATION_RETENTION:PT24H}
    cleanup-batch-size: ${EMAIL_VERIFICATION_CLEANUP_BATCH_SIZE:100}
    cleanup-initial-delay: ${EMAIL_VERIFICATION_CLEANUP_INITIAL_DELAY:PT15M}
    cleanup-interval: ${EMAIL_VERIFICATION_CLEANUP_INTERVAL:PT15M}
