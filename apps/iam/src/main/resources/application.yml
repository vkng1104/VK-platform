spring:
  application:
    name: iam
  datasource:
    url: ${IAM_DATABASE_URL:jdbc:postgresql://localhost:5436/vk_platform_iam}
    username: ${IAM_DATABASE_USERNAME:vk_platform_iam}
    password: ${IAM_DATABASE_PASSWORD:vk_platform_iam}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    default-property-inclusion: non_null

server:
  port: ${IAM_PORT:8081}
  shutdown: graceful
  max-http-request-header-size: 1MB
  servlet:
    session:
      timeout: ${IAM_BROWSER_SESSION_TIMEOUT:P30D}
      cookie:
        name: ${IAM_SESSION_COOKIE_NAME:VK_IAM_SESSION}
        http-only: true
        secure: ${IAM_SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

iam:
  authentication:
    audience: ${IAM_AUTHENTICATION_AUDIENCE:vk-platform-web}
    grant-ttl: ${IAM_AUTHENTICATION_GRANT_TTL:PT5M}
  session:
    enabled: ${IAM_SESSION_ENABLED:false}
    bff-client-id: ${IAM_BFF_CLIENT_ID:vk-platform-bff}
    bff-client-secret: ${IAM_BFF_CLIENT_SECRET:}
    bff-origin: ${IAM_BFF_ORIGIN:http://localhost:3000}
    absolute-ttl: ${IAM_ABSOLUTE_SESSION_TTL:P30D}
    browser-cookie-name: ${IAM_SESSION_COOKIE_NAME:VK_IAM_SESSION}
    browser-cookie-secure: ${IAM_SESSION_COOKIE_SECURE:true}
  oauth:
    enabled: ${IAM_OAUTH_ENABLED:false}
    signing-key-id: ${IAM_OAUTH_SIGNING_KEY_ID:}
    signing-private-key-pkcs8-base64: ${IAM_OAUTH_SIGNING_PRIVATE_KEY_PKCS8_BASE64:}
    signing-public-key-x509-base64: ${IAM_OAUTH_SIGNING_PUBLIC_KEY_X509_BASE64:}
    jwks-cache-ttl: ${IAM_OAUTH_JWKS_CACHE_TTL:PT5M}
    authorization:
      issuer: ${IAM_OAUTH_ISSUER:http://localhost:8081}
      audience: ${IAM_OAUTH_AUDIENCE:vk-platform-api}
      login-uri: ${IAM_OAUTH_LOGIN_URI:http://localhost:3000/sign-in}
      bff-redirect-uri: ${IAM_OAUTH_BFF_REDIRECT_URI:http://localhost:3000/api/auth/callback}
      authorization-code-ttl: ${IAM_OAUTH_AUTHORIZATION_CODE_TTL:PT5M}
      access-token-ttl: ${IAM_OAUTH_ACCESS_TOKEN_TTL:PT5M}
      refresh-token-ttl: ${IAM_OAUTH_REFRESH_TOKEN_TTL:P30D}
    clients:
      service-client-id: ${IAM_SERVICE_CLIENT_ID:vk-platform-service}
      service-bootstrap-secret: ${IAM_SERVICE_CLIENT_SECRET:}
      service-audience: ${IAM_OAUTH_SERVICE_AUDIENCE:vk-platform-services}
      service-scopes: ${IAM_SERVICE_CLIENT_SCOPES:iam.authorization.check,iam.relationship.write}
  signing-keys:
    protection-keys: ${IAM_SIGNING_KEY_PROTECTION_KEYS:}
    protection-version: ${IAM_SIGNING_KEY_PROTECTION_VERSION:}
    publication-safety-overlap: ${IAM_SIGNING_KEY_PUBLICATION_SAFETY_OVERLAP:PT1M}
    retirement-enabled: ${IAM_SIGNING_KEY_RETIREMENT_ENABLED:true}
    retirement-initial-delay: ${IAM_SIGNING_KEY_RETIREMENT_INITIAL_DELAY:PT1M}
    retirement-interval: ${IAM_SIGNING_KEY_RETIREMENT_INTERVAL:PT5M}
  operations:
    cleanup-enabled: ${IAM_CLEANUP_ENABLED:false}
    session-retention: ${IAM_SESSION_RETENTION:P90D}
    authorization-retention: ${IAM_AUTHORIZATION_RETENTION:P30D}
    audit-retention: ${IAM_SECURITY_AUDIT_RETENTION:P365D}
    signing-key-retention: ${IAM_SIGNING_KEY_RETENTION:P90D}
    cleanup-batch-size: ${IAM_CLEANUP_BATCH_SIZE:100}
    cleanup-initial-delay: ${IAM_CLEANUP_INITIAL_DELAY:PT15M}
    cleanup-interval: ${IAM_CLEANUP_INTERVAL:PT15M}
    operator-operation: ${IAM_OPERATOR_OPERATION:}
    operator-actor: ${IAM_OPERATOR_ACTOR:}
    operator-operation-id: ${IAM_OPERATOR_OPERATION_ID:}
    operator-key-id: ${IAM_OPERATOR_KEY_ID:}
    operator-client-id: ${IAM_OPERATOR_CLIENT_ID:}
    operator-client-secret: ${IAM_OPERATOR_CLIENT_SECRET:}
    operator-client-secret-expires-at: ${IAM_OPERATOR_CLIENT_SECRET_EXPIRES_AT:}
    operator-batch-size: ${IAM_OPERATOR_BATCH_SIZE:100}
  email:
    provider: ${EMAIL_PROVIDER:disabled}
    from-address: ${EMAIL_FROM_ADDRESS:}
    gmail-client-id: ${GMAIL_CLIENT_ID:}
    gmail-client-secret: ${GMAIL_CLIENT_SECRET:}
    gmail-refresh-token: ${GMAIL_REFRESH_TOKEN:}
    otp-pepper: ${EMAIL_OTP_PEPPER:}
    rate-limit-secret: ${EMAIL_RATE_LIMIT_SECRET:}
    cleanup-enabled: ${EMAIL_VERIFICATION_CLEANUP_ENABLED:true}
    cleanup-retention: ${EMAIL_VERIFICATION_RETENTION:PT24H}
    cleanup-batch-size: ${EMAIL_VERIFICATION_CLEANUP_BATCH_SIZE:100}
    cleanup-initial-delay: ${EMAIL_VERIFICATION_CLEANUP_INITIAL_DELAY:PT15M}
    cleanup-interval: ${EMAIL_VERIFICATION_CLEANUP_INTERVAL:PT15M}
