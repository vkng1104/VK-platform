openapi: 3.1.2
info:
  title: VK Platform API
  version: v1
  description: Public HTTP API for VK Platform resource domains.
servers:
  - url: /
    description: Current API origin
tags:
  - name: Platform
    description: Service-level operations.
  - name: Projects
    description: Published portfolio project operations.
paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
        - Platform
      summary: Check API health
      responses:
        "200":
          description: The API process is healthy.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: api
  /api/v1/projects:
    get:
      operationId: listProjects
      tags:
        - Projects
      summary: List published projects
      parameters:
        - name: featured
          in: query
          description: Return only projects whose featured state matches this value. Provide at most once.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Published projects in display order.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "400":
          $ref: "#/components/responses/InvalidFeaturedFilter"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/projects/{slug}:
    get:
      operationId: getProjectBySlug
      tags:
        - Projects
      summary: Get a published project
      parameters:
        - name: slug
          in: path
          description: Lowercase kebab-case project identifier.
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          example: vk-platform
      responses:
        "200":
          description: The requested published project.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetailResponse"
        "400":
          $ref: "#/components/responses/InvalidProjectSlug"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  headers:
    RequestID:
      description: Server-generated identifier for correlating a request with API logs.
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
      example: 0a1b2c3d4e5f67890123456789abcdef
  responses:
    InvalidFeaturedFilter:
      description: The featured filter was malformed, duplicated, or accompanied by another query parameter.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: INVALID_FEATURED_FILTER
            message: The featured filter must be either true or false.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: false
            fields:
              featured:
                - Use true or false and provide the filter at most once.
    InvalidProjectSlug:
      description: The project slug is invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: INVALID_PROJECT_SLUG
            message: The project slug is invalid.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: false
    ProjectNotFound:
      description: No published project has the requested slug.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: PROJECT_NOT_FOUND
            message: The requested project was not found.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: false
    InternalError:
      description: An unexpected internal failure occurred.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicError"
          example:
            code: INTERNAL_ERROR
            message: Something went wrong. Try again later or contact support with the request ID.
            request_id: 0a1b2c3d4e5f67890123456789abcdef
            retryable: true
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: api
    ProjectSummary:
      type: object
      additionalProperties: false
      required:
        - slug
        - title
        - summary
        - period
        - role
        - technologies
        - featured
        - repository_url
        - live_url
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
        summary:
          type: string
        period:
          type: string
        role:
          type: string
        technologies:
          type: array
          items:
            type: string
        featured:
          type: boolean
        repository_url:
          type:
            - string
            - "null"
          format: uri
        live_url:
          type:
            - string
            - "null"
          format: uri
    ProjectDetail:
      type: object
      additionalProperties: false
      required:
        - slug
        - title
        - summary
        - period
        - role
        - content_markdown
        - technologies
        - featured
        - repository_url
        - live_url
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
        summary:
          type: string
        period:
          type: string
        role:
          type: string
        content_markdown:
          type: string
        technologies:
          type: array
          items:
            type: string
        featured:
          type: boolean
        repository_url:
          type:
            - string
            - "null"
          format: uri
        live_url:
          type:
            - string
            - "null"
          format: uri
    ProjectListResponse:
      type: object
      additionalProperties: false
      required:
        - projects
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
    ProjectDetailResponse:
      type: object
      additionalProperties: false
      required:
        - project
      properties:
        project:
          $ref: "#/components/schemas/ProjectDetail"
    PublicError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        retryable:
          type: boolean
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
