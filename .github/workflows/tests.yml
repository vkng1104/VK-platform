name: Pull request tests

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.areas.outputs.web }}
      api: ${{ steps.areas.outputs.api }}
      iam: ${{ steps.areas.outputs.iam }}
      ai: ${{ steps.areas.outputs.ai }}
      setup: ${{ steps.areas.outputs.setup }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Map changed files to CI areas
        id: areas
        shell: bash
        run: git diff --name-only HEAD^1 HEAD | scripts/ci/changed-areas.sh | tee -a "$GITHUB_OUTPUT"

  frontend:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: make test-web

  backend-unit:
    name: ${{ matrix.service }} unit tests
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.iam == 'true' || needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - iam
          - ai

    # Job conditions cannot read the matrix, so each service skips its own steps.
    steps:
      - name: Check out repository
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: actions/checkout@v7

      - name: Run backend unit tests in Docker
        if: needs.changes.outputs[matrix.service] == 'true'
        run: make test-${{ matrix.service }}

  backend-integration:
    name: Backend integration tests
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.iam == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run backend integration tests in Docker
        run: make test-integration

  setup:
    name: Local and CI setup tests
    needs: changes
    if: needs.changes.outputs.setup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test local and CI setup
        run: make test-setup test-persistence
