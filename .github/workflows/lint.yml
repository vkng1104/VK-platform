name: Lint

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.areas.outputs.web }}
      api: ${{ steps.areas.outputs.api }}
      iam: ${{ steps.areas.outputs.iam }}
      ai: ${{ steps.areas.outputs.ai }}
      persistence: ${{ steps.areas.outputs.persistence }}
      dbdiagram: ${{ steps.areas.outputs.dbdiagram }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Map changed files to CI areas
        id: areas
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD
          fi | scripts/ci/changed-areas.sh | tee -a "$GITHUB_OUTPUT"

  frontend:
    name: Frontend lint
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: make lint-web

      - name: Type-check frontend
        run: make typecheck

  api:
    name: API lint
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Lint API
        run: make lint-api

  iam:
    name: IAM compile check
    needs: changes
    if: needs.changes.outputs.iam == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile IAM in Docker
        run: make lint-iam

  ai:
    name: AI lint and type check
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint and type-check AI runtime in Docker
        run: make lint-ai

  persistence:
    name: Persistence architecture
    needs: changes
    if: needs.changes.outputs.persistence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check ORM boundaries and generated persistence
        run: make check-persistence

  dbdiagram:
    name: Database diagrams
    needs: changes
    if: needs.changes.outputs.dbdiagram == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check dbdiagram files match migrations
        run: make check-dbdiagram
